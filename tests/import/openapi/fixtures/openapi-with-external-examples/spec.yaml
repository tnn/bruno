openapi: 3.0.0
info:
  title: External Examples Demo
  version: '1'
paths:
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                default:
                  summary: Profile of the calling user
                  externalValue: './examples/me.json'
                yaml-variant:
                  summary: Same profile, served as YAML
                  externalValue: './examples/me.yaml'
        '500':
          description: Error
          content:
            application/xml:
              examples:
                broken:
                  externalValue: './examples/error.xml'
                missing:
                  externalValue: './examples/does-not-exist.xml'
